name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOVE_VERSION: "11.5"

jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: info
        run: |
          tag=$GITHUB_REF_NAME
          [[ "$GITHUB_REF_TYPE" == tag ]] || tag=v0.0.0-dev
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "name=CelLove-$tag" >> "$GITHUB_OUTPUT"

      - name: Notes
        if: github.ref_type == 'tag'
        env:
          NAME: ${{ steps.info.outputs.name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          icon() { echo "<img src=\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/texturepacks/default/$1.png\" width=\"20\" align=\"absmiddle\">"; }
          install=$(icon cells/generator)
          changelog=$(icon cells/mover)
          nudger=$(icon cells/nudger)
          arrow=$(icon ui/arrow)
          full="https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          [[ -z "$prev" ]] || full="https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          discord="https://img.shields.io/badge/Discord-Join%20the%20server-5865F2?style=for-the-badge&logo=discord&logoColor=white"
          downloads="https://img.shields.io/github/downloads/$GITHUB_REPOSITORY/total?style=for-the-badge&label=Downloads&logo=github&logoColor=white&color=2EA043"

          cat > notes.md <<EOF
          ## $install Installation

          $arrow **Windows:** Download \`$NAME-Windows.zip\`, extract it and run the \`.exe\`

          $arrow **Linux:** Download \`$NAME-Linux.AppImage\`, run \`chmod +x\` on it, then launch it

          $arrow **macOS:** Download \`$NAME-macOS.zip\`, extract it and right-click \`CelLove.app\` -> Open (it's unsigned)

          $arrow **Android:** Download \`$NAME-Android.apk\` and open it (it can appear a few minutes after the release)

          $arrow **Other/Any:** Install [LÖVE 11.5](https://love2d.org) and open \`$NAME.love\` with it

          ## $changelog Release Notes

          EOF

          order="feat fix perf refactor revert docs style test build ci chore"

          git log ${prev:+$prev..}"$GITHUB_REF_NAME" --no-merges --pretty="tformat:%s (%h)" |
            awk -v order="$order" '
              BEGIN { n = split(order, types, " "); for (i = 1; i <= n; i++) rank[types[i]] = i }
              { type = $0; sub(/[(!:].*/, "", type); print (type in rank ? rank[type] : n + 1) "\t" $0 }
            ' | sort -s -n -k1,1 | cut -f2- |
            while IFS= read -r line; do printf '%s %s\n\n' "$arrow" "$line"; done >> notes.md

          cells=$([[ -z "$prev" ]] || git diff --name-only --diff-filter=A "$prev" "$GITHUB_REF_NAME" -- 'content/cells/*.lua' ':(exclude)content/cells/abstract/*')

          if [[ -n "$cells" ]]; then
            printf '## %s New Cells\n\n' "$(icon cells/cellove)" >> notes.md

            while IFS= read -r file; do
              field() { sed -n "s/^[[:space:]]*$1 = \"\(.*\)\",\{0,1\}\$/\1/p" "$file" | head -1 | sed 's/\\"/"/g'; }
              printf '%s **%s:** %s\n\n' "$(icon "cells/$(field name)")" "$(field title)" "$(field description)" >> notes.md
            done <<< "$cells"
          fi

          cat >> notes.md <<EOF
          $nudger **[Full changelog]($full)**

          [![Discord]($discord)](https://discord.gg/sgyE9DmZXP) [![Downloads]($downloads)](https://github.com/$GITHUB_REPOSITORY/releases)
          EOF

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: notes
          path: notes.md
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit
          find . -name '*.lua' -print0 | xargs -0 -n1 luajit -bl > /dev/null

  love:
    needs: [info, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write version
        run: |
          printf 'return {\n    version = {\n        number = "%s",\n        build = "%s"\n    }\n}\n' \
            "${{ needs.info.outputs.version }}" "${GITHUB_SHA::7}" > src/constants/version.lua

      - uses: love-actions/love-actions-core@v1
        with:
          build-list: ./main.lua ./conf.lua ./src/ ./content/ ./texturepacks/
          package-path: ./${{ needs.info.outputs.name }}.love

      - uses: actions/upload-artifact@v4
        with:
          name: build-love
          path: ./*.love
          retention-days: 1

  windows:
    needs: [info, love]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-love

      - uses: love-actions/love-actions-windows@v2
        with:
          love-ref: ${{ env.LOVE_VERSION }}
          love-package: ./${{ needs.info.outputs.name }}.love
          product-name: ${{ needs.info.outputs.name }}-Windows
          output-folder: ./build

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: ./build/*
          retention-days: 1

  linux:
    needs: [info, love]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-love

      - uses: love-actions/love-actions-linux@v2
        with:
          app-name: CelLove
          bundle-id: io.github.nickisadev.cellove
          description: A sandbox game based on Cell Machine by Sam Hogan.
          icon-path: ./texturepacks/default/ui/icon.png
          version-string: ${{ needs.info.outputs.version }}
          love-ref: ${{ env.LOVE_VERSION }}
          love-package: ./${{ needs.info.outputs.name }}.love
          product-name: ${{ needs.info.outputs.name }}-Linux
          output-folder: ./build

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: ./build/*
          retention-days: 1

  macos:
    needs: [info, love]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-love

      - name: Build app
        env:
          NAME: ${{ needs.info.outputs.name }}
          VERSION: ${{ needs.info.outputs.version }}
        run: |
          curl -fsSL -o love.zip "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          unzip -q love.zip
          cp "./$NAME.love" love.app/Contents/Resources/
          mv love.app CelLove.app

          python3 - <<'PY'
          import os, plistlib

          path = "CelLove.app/Contents/Info.plist"
          with open(path, "rb") as file:
              info = plistlib.load(file)

          info.update(
              CFBundleName="CelLove",
              CFBundleDisplayName="CelLove",
              CFBundleIdentifier="io.github.nickisadev.cellove",
              CFBundleShortVersionString=os.environ["VERSION"]
          )
          with open(path, "wb") as file:
              plistlib.dump(info, file)
          PY

          mkdir build
          zip -qry "build/$NAME-macOS.zip" CelLove.app

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: ./build/*
          retention-days: 1

  android:
    needs: [info, love]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-love

      - name: Generate icons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            size=${density#*:}
            mkdir -p ".github/android/res/drawable-${density%:*}"
            convert texturepacks/default/ui/icon.png -filter point -resize ${size}x${size} \
              ".github/android/res/drawable-${density%:*}/icon.png"
          done

      - uses: love-actions/love-actions-android@v2
        with:
          app-name: CelLove
          bundle-id: io.github.nickisadev.cellove
          resource-path: ./.github/android/res
          icon-specifier: "@drawable/icon"
          love-package: ./${{ needs.info.outputs.name }}.love
          product-name: ${{ needs.info.outputs.name }}-Android
          version-string: ${{ needs.info.outputs.version }}
          version-code: ${{ github.run_number }}
          output-folder: ./build

      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: ./build/*
          retention-days: 1

  release:
    needs: [info, windows, linux, macos]
    if: ${{ github.ref_type == 'tag' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)

          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CelLove $GITHUB_REF_NAME" \
            --notes-file notes/notes.md

  attach:
    needs: [release, android]
    if: ${{ needs.release.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-android
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
